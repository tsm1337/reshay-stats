<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Статистика Решай сам</title>
<style>
:root{--bg:#f5f6f8;--fg:#15181d;--muted:#5d6672;--panel:#fff;--line:#d9dde3;--a1:#2f5fd0}
@media (prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8ebef;--muted:#98a1ad;--panel:#1a1e24;--line:#2b313a;--a1:#6b97ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,sans-serif;padding:24px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
main{max-width:56rem;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:1.5rem;margin:0}h2{font-size:1rem;margin:0 0 10px}
.m{color:var(--muted);font-size:.85rem;margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,17rem),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.k{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.k span{display:block;color:var(--muted);font-size:.8rem}.k b{font-size:1.6rem;font-variant-numeric:tabular-nums;font-weight:600}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:.85rem}th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
svg{width:100%;height:auto;display:block}
</style></head><body><main>
<div><h1>Статистика «Решай сам»</h1><p class="m" id="upd">Загрузка…</p></div>
<div class="grid">
<section class="card"><h2>YouTube Shorts</h2><div class="k"><div><span>Просмотры</span><b id="yv">—</b></div><div><span>Лайки</span><b id="yl">—</b></div><div><span>Комментарии</span><b id="yc">—</b></div><div><span>Подписчики</span><b id="ys">—</b></div></div></section>
<section class="card"><h2>TikTok</h2><div class="k"><div><span>Просмотры</span><b id="tv">—</b></div><div><span>Лайки</span><b id="tl">—</b></div><div><span>Комментарии</span><b id="tc">—</b></div><div><span>Подписчики</span><b id="ts">—</b></div></div><p class="m" id="tu"></p></section>
</div>
<section class="card"><h2>Просмотры YouTube по времени</h2><div id="ch"></div></section>
<section class="card"><h2>По роликам</h2><div class="tw"><table><thead><tr><th>Платформа</th><th>Ролик</th><th>Просмотры</th><th>Лайки</th><th>Комментарии</th></tr></thead><tbody id="rows"></tbody></table></div></section>
</main>
<script>
const f=n=>n==null?'—':Number(n).toLocaleString('ru-RU'),$=id=>document.getElementById(id);
const sum=(a,k)=>a.some(x=>x[k]!=null)?a.reduce((s,x)=>s+(x[k]||0),0):null;
const RAW='https://raw.githubusercontent.com/tsm1337/reshay-stats/main/';
const get=u=>fetch(RAW+u+'?t='+Date.now()).then(r=>r.json()).catch(()=>null);
(async()=>{
const [l,t,h]=await Promise.all([get('latest.json'),get('tiktok.json'),get('history.json')]);
const yv=(l&&l.videos)||[],tv=(t&&t.videos)||[];
$('yv').textContent=f(sum(yv,'views'));$('yl').textContent=f(sum(yv,'likes'));$('yc').textContent=f(sum(yv,'comments'));$('ys').textContent=f(l&&l.subscribers);
$('tv').textContent=f(sum(tv,'views'));$('tl').textContent=f(sum(tv,'likes'));$('tc').textContent=f(sum(tv,'comments'));$('ts').textContent=f(t&&t.followers);
const fd=s=>s?new Date(s).toLocaleString('ru-RU',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'нет данных';
$('upd').textContent='YouTube обновлён: '+fd(l&&l.updated);$('tu').textContent='Обновлено вручную: '+fd(t&&t.updated);
const rows=[...yv.map(v=>['YouTube',v]),...tv.map(v=>['TikTok',v])];
$('rows').replaceChildren(...rows.map(([p,v])=>{const tr=document.createElement('tr');[p,v.title,f(v.views),f(v.likes),f(v.comments)].forEach(x=>{const td=document.createElement('td');td.textContent=x;tr.appendChild(td)});return tr}));
const by={};(h||[]).forEach(r=>{by[r.ts]=(by[r.ts]||0)+r.views});
const pts=Object.entries(by).sort().map(([k,v])=>[new Date(k.replace('Z',':00Z')).getTime(),v]);
const el=$('ch');
if(pts.length<2){el.innerHTML='<p class="m">График появится после нескольких замеров.</p>';return}
const W=640,H=200,m={l:44,r:12,t:10,b:24},x0=pts[0][0],x1=pts[pts.length-1][0],ym=Math.max(...pts.map(p=>p[1]))*1.1||1;
const X=t=>m.l+(t-x0)/(x1-x0)*(W-m.l-m.r),Y=v=>H-m.b-v/ym*(H-m.t-m.b);
const d=pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[1]).toFixed(1)).join('');
const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('viewBox',`0 0 ${W} ${H}`);
const add=(n,a,tx)=>{const e=document.createElementNS(ns,n);for(const k in a)e.setAttribute(k,a[k]);if(tx!=null)e.textContent=tx;s.appendChild(e)};
[0,.5,1].forEach(q=>{const v=ym/1.1*q;add('line',{x1:m.l,x2:W-m.r,y1:Y(v),y2:Y(v),stroke:'var(--line)'});add('text',{x:m.l-6,y:Y(v)+4,'text-anchor':'end','font-size':11,fill:'var(--muted)'},f(Math.round(v)))});
add('text',{x:m.l,y:H-6,'font-size':11,fill:'var(--muted)'},fd(new Date(x0)));add('text',{x:W-m.r,y:H-6,'text-anchor':'end','font-size':11,fill:'var(--muted)'},fd(new Date(x1)));
add('path',{d,fill:'none',stroke:'var(--a1)','stroke-width':2});add('circle',{cx:X(x1),cy:Y(pts[pts.length-1][1]),r:4,fill:'var(--a1)'});
el.replaceChildren(s);
})();
</script></body></html>
