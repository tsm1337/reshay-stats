<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0b1020;font-family:'Inter','DejaVu Sans',sans-serif}
#st{position:absolute;left:0;top:0;width:1080px;height:1920px}
#sub{position:absolute;left:0;width:1080px;top:1400px;height:220px;display:flex;align-items:center;justify-content:center}
#si{text-align:center;font-weight:900;font-size:100px;line-height:1;white-space:nowrap;color:#fff;text-transform:uppercase;letter-spacing:-2px;text-shadow:0 6px 0 #000,0 0 24px rgba(0,0,0,.8);-webkit-text-stroke:8px #0b1020;paint-order:stroke fill}
#si span.k{color:#ffd23f}#si span.r{color:#ff4d5e}#si span.g{color:#3ddc84}
</style></head><body>
<svg id="st" viewBox="0 0 1080 1920" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171e45"/><stop offset=".6" stop-color="#0c1127"/><stop offset="1" stop-color="#05070f"/></linearGradient>
<radialGradient id="glow"><stop offset="0" stop-color="#3ddc84" stop-opacity=".38"/><stop offset="1" stop-color="#3ddc84" stop-opacity="0"/></radialGradient>
<radialGradient id="rglow"><stop offset="0" stop-color="#ff4d5e" stop-opacity=".5"/><stop offset="1" stop-color="#ff4d5e" stop-opacity="0"/></radialGradient>
<radialGradient id="vig" cx=".5" cy=".5" r=".75"><stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".55"/></radialGradient>
<linearGradient id="ph" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f3870"/><stop offset="1" stop-color="#171c3c"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f0a500"/></linearGradient>
<clipPath id="scr"><rect x="270" y="500" width="540" height="860" rx="52"/></clipPath>
<g id="bill"><rect x="-60" y="-30" width="120" height="60" rx="8" fill="#2fb56f"/><rect x="-52" y="-22" width="104" height="44" rx="5" fill="none" stroke="#a6f0c8" stroke-width="3"/><circle r="15" fill="#a6f0c8"/><text y="7" text-anchor="middle" font-size="20" font-weight="900" fill="#1c7a4a">₽</text></g>
<g id="coin"><circle r="40" fill="url(#gold)"/><circle r="30" fill="none" stroke="#b97800" stroke-width="4"/><text y="14" text-anchor="middle" font-size="40" font-weight="900" fill="#b97800">₽</text></g>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<circle id="g1" cx="540" cy="360" r="520" fill="url(#glow)"/>
<circle id="g2" cx="540" cy="940" r="640" fill="url(#rglow)" opacity="0"/>
<g id="grid" opacity=".07" stroke="#fff" stroke-width="2"></g>
<g id="bills"></g>
<!-- tag -->
<g id="tag"><rect x="290" y="84" width="500" height="78" rx="39" fill="#ffd23f"/><text x="540" y="136" text-anchor="middle" font-size="40" font-weight="900" fill="#0b1020" letter-spacing="2">ЧТО БЫ ТЫ СДЕЛАЛ?</text></g>
<!-- prize -->
<g id="prize"><text x="540" y="310" text-anchor="middle" font-size="150" font-weight="900" fill="#3ddc84" stroke="#0b1020" stroke-width="10" paint-order="stroke">5 000 ₽</text></g>
<use id="c1" href="#coin" x="140" y="262"/><use id="c2" href="#coin" x="940" y="262"/>
<!-- timer -->
<g id="timer"><rect x="290" y="352" width="500" height="124" rx="30" fill="#0b1020" stroke="#3ddc84" stroke-width="6" id="tbox"/>
<text id="tt" x="540" y="441" text-anchor="middle" font-family="DejaVu Sans Mono" font-size="100" font-weight="700" fill="#fff">60:00</text>
<rect x="290" y="494" width="500" height="12" rx="6" fill="#ffffff22"/><rect id="tbar" x="290" y="494" width="500" height="12" rx="6" fill="#3ddc84"/></g>
<!-- phone -->
<g id="phone"><rect x="250" y="520" width="580" height="880" rx="70" fill="url(#ph)" stroke="#5560ac" stroke-width="8"/>
<rect x="270" y="540" width="540" height="840" rx="52" fill="#0d1130"/>
<rect x="475" y="555" width="130" height="26" rx="13" fill="#05070f"/>
<text x="310" y="578" font-size="26" font-weight="700" fill="#8e98d8">9:41</text>
<rect x="740" y="560" width="42" height="20" rx="5" fill="none" stroke="#8e98d8" stroke-width="3"/><rect x="744" y="564" width="26" height="12" rx="2" fill="#8e98d8"/>
<g clip-path="url(#scr)" id="msgs"></g>
<g id="lock"><circle cx="540" cy="960" r="125" fill="#1b2150" stroke="#3ddc84" stroke-width="8"/><rect x="488" y="955" width="104" height="82" rx="14" fill="#3ddc84"/><path d="M508 955v-30a32 32 0 0 1 64 0v30" fill="none" stroke="#3ddc84" stroke-width="16" stroke-linecap="round"/><rect x="532" y="980" width="16" height="32" rx="6" fill="#0b1020"/><g stroke="#ff4d5e" stroke-width="12" stroke-linecap="round"><path d="M410 830L670 1090" opacity="0"/></g></g></g>
<g id="wallet" opacity="0"><rect x="150" y="620" width="780" height="480" rx="50" fill="#1d2552" stroke="#5560ac" stroke-width="8"/><rect x="150" y="690" width="780" height="80" fill="#0b1020"/><rect x="200" y="830" width="120" height="90" rx="14" fill="url(#gold)"/><text x="540" y="1010" text-anchor="middle" font-size="130" font-weight="900" fill="#ff4d5e">312 ₽</text><text x="200" y="1070" font-size="30" font-weight="700" fill="#8e98d8">НА КАРТЕ</text><g transform="translate(790 800)"><rect x="-90" y="-80" width="180" height="170" rx="22" fill="#fff"/><rect x="-90" y="-80" width="180" height="50" rx="22" fill="#ff4d5e"/><text y="52" text-anchor="middle" font-size="80" font-weight="900" fill="#0b1020">3</text><text y="82" text-anchor="middle" font-size="24" font-weight="900" fill="#0b1020">ДНЯ</text></g></g>
<!-- ring waves -->
<g id="waves" fill="none" stroke="#ff4d5e" stroke-width="8" stroke-linecap="round" opacity="0"></g>
<!-- options -->
<g id="o1" opacity="0"><rect x="-230" y="-125" width="460" height="250" rx="40" fill="#123d2a" stroke="#3ddc84" stroke-width="8"/><circle cy="-62" r="36" fill="#3ddc84"/><text y="-44" text-anchor="middle" font-size="52" font-weight="900" fill="#0b1020">1</text><text y="26" text-anchor="middle" font-size="46" font-weight="900" fill="#fff">ЗАБРАТЬ</text><text y="92" text-anchor="middle" font-size="58" font-weight="900" fill="#3ddc84">5 000 ₽</text></g>
<g id="o2" opacity="0"><rect x="-230" y="-125" width="460" height="250" rx="40" fill="#45141c" stroke="#ff4d5e" stroke-width="8"/><circle cy="-62" r="36" fill="#ff4d5e"/><text y="-44" text-anchor="middle" font-size="52" font-weight="900" fill="#0b1020">2</text><text y="26" text-anchor="middle" font-size="46" font-weight="900" fill="#fff">ПОЗВОНИТЬ</text><text y="92" text-anchor="middle" font-size="58" font-weight="900" fill="#ff4d5e">МАМЕ</text></g>
<text id="hand" x="540" y="1860" text-anchor="middle" font-size="34" font-weight="700" fill="#6c76b5">@reshay_sam_serial</text>
<rect width="1080" height="1920" fill="url(#vig)"/>
</svg>
<div id="sub"><div id="si"></div></div>
<script>
const D=__DATA__;
const W=D.words,S=D.sent.map(a=>a[1]),T=D.total;
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=x=>1-Math.pow(1-cl(x),3);
const st=i=>S[i];
const sEnd=i=>D.sent[i][1]+D.sent[i][2];
// static decor
let g='';for(let i=0;i<=1080;i+=90)g+=`<path d="M${i} 0V1920"/>`;for(let i=0;i<=1920;i+=90)g+=`<path d="M0 ${i}H1080"/>`;$('grid').innerHTML=g;
const rnd=i=>{const x=Math.sin(i*127.1)*43758.5453;return x-Math.floor(x)};
const BILLS=[...Array(16).keys()].map(i=>({x:40+rnd(i)*1000,sp:70+rnd(i+30)*90,ph:rnd(i+60)*2200,r:rnd(i+90)*360,rs:(rnd(i+120)-.5)*120,sc:.7+rnd(i+150)*.7}));
// subtitles
const KEY=/тысяч|телефона|срочно|мам|сорок|час$|первое|второе|один|два|сделал|таймер|рублей|пять/i;
const RED=/срочно|мам/i,GRN=/тысяч|рублей|пять|забрать/i;
const chunks=[];let cur=[];
const flush=()=>{if(cur.length){chunks.push({t:cur[0].t,e:cur[cur.length-1].t+cur[cur.length-1].d,w:cur});cur=[]}};
W.forEach((w,i)=>{const n=W[i+1];
 if(cur.length&&(cur.map(x=>x.w).join(' ')+' '+w.w).length>13)flush();
 cur.push(w);
 const brk=!n||n.s!==w.s||cur.length>=3||(cur.length>=2&&KEY.test(w.w));
 if(brk)flush();});
const esc=s=>s.replace(/[.,:!?]/g,'');
function subHTML(c){return c.w.map(x=>{const t=esc(x.w);const cls=RED.test(t)?'r':GRN.test(t)?'g':KEY.test(t)?'k':'';return cls?`<span class="${cls}">${t}</span>`:t}).join(' ')}
// messages
const MSG=[["Лена","ты где? ответь","#9b5de5","Л"],["Банк","Списание 890 ₽","#00a6fb","Б"],["Работа","срочно по проекту","#f15bb5","Р"],["Курьер","Ваш заказ у двери","#fb8500","К"]];
const mk=(y,col,av,ini,name,txt,sc)=>`<g transform="translate(540 ${y+65}) scale(${sc}) translate(-540 -${y+65})"><rect x="290" y="${y}" width="500" height="130" rx="26" fill="${col}"/><circle cx="352" cy="${y+65}" r="34" fill="${av}"/><text x="352" y="${y+78}" text-anchor="middle" font-size="36" font-weight="900" fill="#fff">${ini}</text><text x="410" y="${y+55}" font-size="32" font-weight="900" fill="#fff">${name}</text><text x="410" y="${y+98}" font-size="30" font-weight="700" fill="#ffffffd0">${txt}</text></g>`;
function draw(t){
 const t2=st(4),t5=W.find(w=>w.s===9&&/сорок/i.test(w.w));const t5e=t5?t5.t+t5.d:sEnd(9);
 let rem=3600;
 if(t>=t2)rem=3599-(3599-2400)*ease((t-t2)/(t5e-t2));
 if(t>=t5e)rem=2400;
 const mm=String(Math.floor(rem/60)).padStart(2,'0'),ss=String(Math.floor(rem%60)).padStart(2,'0');
 $('tt').textContent=mm+':'+ss;
 const late=t>=st(7);
 $('tbox').setAttribute('stroke',late?'#ff4d5e':'#3ddc84');
 $('tt').setAttribute('fill',late?'#ff8a96':'#fff');
 $('tbar').setAttribute('width',500*rem/3600);$('tbar').setAttribute('fill',late?'#ff4d5e':'#3ddc84');
 // bills
 let b='';BILLS.forEach(o=>{const y=((o.ph+t*o.sp)%2300)-190;b+=`<use href="#bill" transform="translate(${o.x+Math.sin(t*1.3+o.ph)*20} ${y}) rotate(${o.r+t*o.rs}) scale(${o.sc})"/>`});
 $('bills').innerHTML=b;$('bills').setAttribute('opacity',(late?0.18:0.42)*ease((t-st(1))/0.6));
 // intro
 const p=ease((t-st(1))/0.45);$('prize').setAttribute('transform',`translate(540 250) scale(${0.5+0.5*p}) translate(-540 -250)`);$('prize').setAttribute('opacity',p);
 $('c1').setAttribute('transform',`translate(0 ${Math.sin(t*3)*10}) rotate(${Math.sin(t*2)*12} 140 262)`);
 $('c2').setAttribute('transform',`translate(0 ${Math.sin(t*3+1.5)*10}) rotate(${Math.sin(t*2+1)*-12} 940 262)`);
 $('c1').setAttribute('opacity',p);$('c2').setAttribute('opacity',p);
 $('timer').setAttribute('opacity',ease((t-st(2))/0.4));
 $('phone').setAttribute('opacity',ease((t-st(2)+0.2)/0.45));
 $('lock').setAttribute('opacity',ease((t-st(3))/0.3)*(1-ease((t-t2)/0.4)));
 const wa=ease(t/0.4)*(1-ease((t-st(2)+0.1)/0.3));$('wallet').setAttribute('opacity',wa);$('wallet').setAttribute('transform',`translate(0 ${Math.sin(t*2)*8})`);
 // messages
 let h='';
 MSG.forEach((m,i)=>{const wd=W.find(w=>w.s===5&&w.w.toLowerCase().startsWith(m[0].toLowerCase().slice(0,4)));const a=ease((t-(wd?wd.t:st(5)+i*0.5))/0.3);if(a<=0)return;
   const y=610+i*150+(1-a)*90;const out=ease((t-st(7))/0.4);
   h+=`<g opacity="${a*(1-0.7*out)}">`+mk(y,'#262d63',m[2],m[3],m[0],m[1],0.7+0.3*a)+'</g>';});
 const ma=ease((t-st(7)-0.2)/0.25);
 if(ma>0){const sh=t<st(7)+1.6?Math.sin(t*60)*8*(1-cl((t-st(7)-0.5)/1.1)):0;
  h+=`<g transform="translate(${sh},0)" opacity="${ma}">`+mk(840+(1-ma)*60,'#e0243a','#ff8a96','М','МАМА','позвони срочно!',1.04+0.05*Math.sin(t*10))+`<circle cx="790" cy="${840+(1-ma)*60}" r="24" fill="#ffd23f"/><text x="790" y="${849+(1-ma)*60}" text-anchor="middle" font-size="30" font-weight="900" fill="#0b1020">!</text></g>`;}
 $('msgs').innerHTML=h;
 $('g2').setAttribute('opacity',ma*(0.7+0.3*Math.sin(t*8)));
 // ring waves around phone when mama
 let w='';if(ma>0)for(let k=0;k<3;k++){const ph=((t*1.4+k/3)%1);w+=`<rect x="${250-ph*70}" y="${520-ph*70}" width="${580+ph*140}" height="${880+ph*140}" rx="${70+ph*40}" opacity="${(1-ph)*0.8}"/>`}
 $('waves').innerHTML=w;$('waves').setAttribute('opacity',ma);
 // options
 const o1=ease((t-st(10))/0.3),o2=ease((t-st(11))/0.3);
 const pu=t>=st(13)?0.05*Math.sin((t-st(13))*9):0;
 $('o1').setAttribute('opacity',o1);$('o2').setAttribute('opacity',o2);
 $('o1').setAttribute('transform',`translate(290 1765) scale(${0.85+0.15*o1+pu})`);
 $('o2').setAttribute('transform',`translate(790 1765) scale(${0.85+0.15*o2-pu})`);
 $('hand').setAttribute('opacity',t<st(10)?1:0);
 // subtitles
 const c=chunks.find((c,i)=>t>=c.t-0.02&&t<(chunks[i+1]?chunks[i+1].t:c.e+0.6)&&t<c.e+0.35);
 $('si').innerHTML=c?subHTML(c):'';
}
window.draw=draw;window.T=T;draw(0);
</script></body></html>
