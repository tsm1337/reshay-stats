<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ПОТОП — лист s02</title>
<style>body{margin:0;background:#07090c;color:#cfd6dc;font-family:Inter,sans-serif}#root{width:2000px;padding:50px;box-sizing:border-box}
h1{margin:0 0 6px;font-weight:900;font-size:60px;color:#e6e1d3}h1 span{color:#d0473b}.sub{color:#7d8e9a;font-size:22px;margin-bottom:20px}
h2{font-size:24px;font-weight:800;letter-spacing:2px;color:#9fb2bf;margin:30px 0 12px;text-transform:uppercase}.row{display:flex;gap:20px;flex-wrap:wrap}
.card{background:#10151b;border:1px solid #1e262e;border-radius:14px;padding:12px;text-align:center}.card b{display:block;font-size:20px;color:#e6e1d3;margin-top:6px}.card i{display:block;font-style:normal;font-size:15px;color:#7d8e9a}</style></head>
<body><div id="root"></div><script src="assets.js"></script><script src="assets2.js"></script>
<script>
const A=POTOP,sv=(w,h,vb,s)=>`<svg width="${w}" height="${h}" viewBox="${vb}">${s}</svg>`,card=(s,n,d)=>`<div class="card">${s}<b>${n}</b><i>${d}</i></div>`;
const chars=[[A.ilya(),'Илья','кашляет, свисток'],[A.vera(),'Вера','с фонариком'],[A.anya(),'Аня','под одеялом'],[`<g transform="translate(-55 0) scale(.95)">${A.neighbor(0)}</g><g transform="translate(55 10) scale(.92)">${A.neighbor(1)}</g>`,'Соседи ×10','силуэты, глаза светятся']].map(([s,n,d])=>card(sv(260,400,'-30 0 260 400',s),n,d)).join('');
const props=[[`<g transform="translate(60 30) scale(1.4)">${A.whistle()}</g>`,'Свисток','крупно, с шнурком','0 0 260 130'],[`<g transform="translate(30 10)">${A.phone()}</g>`,'Телефон','поезд 23:40, сети нет (23:12 добавлю в кадре)','0 0 210 310'],[A.boatBlanket({lump:.6}).replace('<g class="boat2">','<g class="boat2" transform="translate(10 40) scale(.4)">'),'Лодка с одеялом','одеяло шевелится','0 0 260 200'],[A.boatBlanket({head:1}).replace('<g class="boat2">','<g class="boat2" transform="translate(10 100) scale(.4)">'),'Аня поднимает голову','финальный кадр','0 0 260 200'],[A.ring(130,100,100)+A.ring(130,100,60,.7),'Кольцо свистка','расходится по воде','0 0 260 200']].map(([s,n,d,vb])=>card(sv(260,200,vb,`<rect width="400" height="400" fill="#0b1c24"/>`+s),n,d)).join('');
const bgs=[[A.bgCellar({wy:1480}),'Подвал, вода по щиколотку','сц. 1–2'],[A.bgCellar({wy:1150})+A.crowd(1190),'Десять человек в воде','сц. 2, 6'],[A.bgCellarBoat({wy:1200,lump:.5}),'Лодка у стены','сц. 3, 13'],[A.bgCellar({wy:1020}),'Вода до колен','сц. 4'],[A.bgCellar({wy:1200,calm:true})+A.ring(540,1380,260),'Вода замерла','сц. 11–12'],[A.bgCity(),'Город с огнями, наш дом чёрный','сц. 1']].map(([s,n,d])=>card(sv(300,533,'0 0 1080 1920',s),n,d)).join('');
document.getElementById('root').innerHTML=`<h1>ПОТОП <span>·</span> серия 2 «Кого посадить?»</h1><div class="sub">Тот же стиль, что в серии 1 · новые ассеты поверх общей библиотеки</div><h2>Персонажи</h2><div class="row">${chars}</div><h2>Реквизит</h2><div class="row">${props}</div><h2>Фоны (9:16)</h2><div class="row">${bgs}</div>`;
</script></body></html>
