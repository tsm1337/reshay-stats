<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>ПОТОП s01</title>
<style>html,body{margin:0;background:#000;width:1080px;height:1920px;overflow:hidden}svg{display:block}</style></head>
<body><div id="stage"></div>
<script src="assets.js"></script>
<script>
const A = POTOP, P = A.P;
const cl = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ramp = (t, a, b) => cl((t - a) / (b - a));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const E = (t, a, b) => ease(ramp(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
const noise = (t, s = 1) => Math.sin(t * 13.1 * s) * .5 + Math.sin(t * 7.7 * s + 1.3) * .3 + Math.sin(t * 23.3 * s + 2.1) * .2;
const cam = (s, cx, cy, r = 0, sx = 0, sy = 0) => `translate(${540 + sx} ${960 + sy}) rotate(${r}) scale(${s}) translate(${-cx} ${-cy})`;
const put = (svg, x, y, s, flip = false, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${flip ? -s : s} ${s}) translate(-100 -392)">${svg}</g>`; // ступни в (x,y)
const blinkAt = (t, period = 3.7, off = 0) => ((t + off) % period) < .12;
const breathe = t => 1 + Math.sin(t * 2.2) * .006;
const pop = (t, a, d = .22) => { const k = ramp(t, a, a + d); return k <= 0 ? 0 : 1 + Math.sin(k * Math.PI) * .12 * (1 - k) + 0; };

let WORDS = [], GROUPS = [], WM = {}, S = [], OUTRO = 2.2;
const T = i => WM[i].s, TE = i => WM[i].e;
const KEY = { 'море': 'y', 'кот': 'y', 'поезд': 'y', 'болен': 'r', 'Вера': 'y', '21:14': 'r', 'затрещал': 'r', 'крениться': 'r', 'записка': 'y', 'подвал': 'r', 'цифры': 'y', 'лодка': 'y', 'одного': 'r', 'десять': 'r', 'сердце': 'r', 'почерк': 'y', 'Аня': 'y', 'вечер': 'r', 'свет': 'y', 'кроме': 'r', 'нашего': 'r', 'дома': 'r' };
function prepWords(raw) {
  const out = [];
  for (let k = 0; k < raw.length; k++) {
    const w = raw[k];
    if (w.w.startsWith('двадцать') && raw[k + 2] && raw[k + 2].w.startsWith('четырнадцать')) { out.push({ d: '21:14', s: w.s, e: raw[k + 2].e, end: false, i: w.i }); k += 2; continue; }
    out.push({ d: w.w.replace(/[«»…]/g, '').replace(/[.,:;!?]+$/, ''), s: w.s, e: w.e, end: /[.…:»!?,]$/.test(w.w), i: w.i });
  }
  return out;
}
function makeGroups(ws) {
  const G = []; let g = [];
  ws.forEach((w, i) => {
    g.push(w);
    const len = g.reduce((a, x) => a + x.d.length + 1, 0), next = ws[i + 1];
    if (w.end || g.length >= 3 || len > 15 || (next && next.s - w.e > .6) || !next) {
      const last = g[g.length - 1];
      if (!w.end && next && g.length > 1 && /^(в|с|во|на|а|и|из|мы|я|не|что)$/i.test(last.d)) { g.pop(); G.push(g); g = [last]; } else { G.push(g); g = []; }
    }
  });
  G.forEach((g, i) => { g.s = g[0].s - .06; g.e = Math.min(G[i + 1] ? G[i + 1][0].s - .06 : 99, g[g.length - 1].e + .7); });
  return G;
}
function subtitles(t) {
  const g = GROUPS.find(g => t >= g.s && t < g.e); if (!g) return '';
  const p = E(t, g.s, g.s + .12);
  const sp = g.map((w, i) => {
    const active = t >= w.s - .03, cur = active && (i === g.length - 1 || t < g[i + 1].s - .03);
    let k = KEY[w.d]; if (w.d === 'дома' && t < T(61) - .2) k = null;
    const col = k === 'r' ? '#ff5444' : k === 'y' ? '#f2cf63' : '#ffffff';
    return `<tspan fill="${col}" fill-opacity="${active ? 1 : .5}" font-size="${cur ? 92 : 84}">${w.d}${i < g.length - 1 ? ' ' : ''}</tspan>`;
  }).join('');
  return `<g transform="translate(540 1585) scale(${lerp(.9, 1, p)})" opacity="${p}"><text x="0" y="0" text-anchor="middle" font-family="Inter" font-weight="900" stroke="#05070a" stroke-width="14" stroke-linejoin="round" paint-order="stroke" letter-spacing="1">${sp}</text></g>`;
}
function rainOverlay(t, op = .4, speed = 1500) {
  const y = (t * speed) % 1920;
  return `<g opacity="${op}"><g transform="translate(${-y * .18} ${y - 1920})">${A.rain(41, 150, 1)}</g><g transform="translate(${-y * .18} ${y})">${A.rain(41, 150, 1)}</g></g>`;
}
function dust(t, n = 26) {
  const r = A.rng(5); let s = '';
  for (let i = 0; i < n; i++) { const x = (r() * 1080 + t * (8 + r() * 14)) % 1080, y = (r() * 1920 - t * (6 + r() * 10) + 1920 * 4) % 1920; s += `<circle cx="${x.toFixed(0)}" cy="${y.toFixed(0)}" r="${(1.5 + r() * 2.5).toFixed(1)}" fill="#d9d2b8" opacity="${(.12 + .2 * Math.abs(Math.sin(t + i))).toFixed(2)}"/>`; }
  return s;
}
const vignette = (k = .85) => `<rect width="1080" height="1920" fill="url(#vig)" opacity="${k}"/>`;
const flash = (t, at, d = .35, c = '#dfe9f2', m = .55) => (t >= at && t < at + d) ? `<rect width="1080" height="1920" fill="${c}" opacity="${m * (1 - (t - at) / d)}"/>` : '';
const lampFlicker = (t, k = 1) => { const n = Math.abs(noise(t, 1.7)); return 1 - k * (n > .62 ? .75 : n * .15); };
let TT = 99;                                      // момент, когда дом начинает крениться
const TILT = t => t < TT ? 0 : -5 * E(t, TT, TT + 1.9);
const sc = (a, b, f) => S.push({ a, b, f });
const noteAt = (cx, cy, s, rot, txt) => `<g transform="translate(${cx} ${cy}) rotate(${rot}) scale(${s}) translate(-92 -63)"><g filter="url(#sh)">${A.note(txt)}</g></g>`;

function buildScenes() {
  S = []; TT = T(63) - .05;
  const a1 = T(13) - .15, a2 = T(23) - .2, a3 = T(36) - .15, a4 = T(42) - .3, a5 = T(53) - .2, a6 = T(58) - .1, a7 = T(61) - .1, a8 = T(63) - .1, a9 = T(67) - .15,
    a10 = T(70) - .05, a11 = T(72) - .1, a12 = T(76) - .15, a13 = T(78) - .1, a14 = T(83) - .1, a15 = T(87) - .2, a16 = T(94) - .2, a17 = T(98) - .2,
    a18 = T(106) - .15, a19 = T(111) - .1, a20 = T(122) - .15, a21 = T(127) - .15, VE = WORDS[WORDS.length - 1].e + .25;
  window.VOICE_END = VE; window.DURATION = VE + OUTRO;

  // 1. Крючок: окно, вместо улицы море. Молния в первые полсекунды
  sc(0, a1, t => ({ w: `<g transform="${cam(lerp(1.0, 1.18, E(t, 0, a1)), 540, lerp(930, 1010, E(t, 0, a1)), 0, noise(t, .3) * 3, noise(t + 3, .3) * 3)}">${A.bgFlood({ t, noRain: true })}</g>${rainOverlay(t, .5)}${flash(t, .25, .5, '#e6f0fa', .4)}${flash(t, T(9) - .1, .45, '#dfe9f2', .45)}` }));
  // 2. Машины → кот смотрит на меня
  sc(a1, a2, t => {
    const dx = t * 6, cx = 690 + dx, cy = 1190 + Math.sin(t * 1.1) * 8, z = lerp(1.5, 3.4, E(t, a1, T(17) + .5));
    const look = t < T(19) - .2 ? -6 : lerp(-6, 0, E(t, T(19) - .2, T(19) + .2)), glow = E(t, T(19), T(19) + .6);
    return { w: `<g transform="${cam(z, lerp(560, cx, E(t, a1, T(17)) ), lerp(1260, cy, E(t, a1, T(17))), 0)}">${A.bgFlood({ t, noRain: true, cat: { look, blink: blinkAt(t, 2.6, .9) && t < T(19) - .3 } })}
      <g opacity="${glow * .6}"><circle cx="${cx - 10}" cy="${cy}" r="14" fill="#f5d85a" filter="url(#blur6)"/><circle cx="${cx + 10}" cy="${cy}" r="14" fill="#f5d85a" filter="url(#blur6)"/></g></g>${rainOverlay(t, .35)}` };
  });
  // 3. Комната Ильи: последний поезд
  sc(a2, a3, t => {
    const ph = E(t, T(28) - .1, T(28) + .4);
    return { w: `<g transform="${cam(lerp(1.0, 1.12, E(t, a2, a3)), 540, 1000)}">${A.bgRoom({ t })}${put(A.ilya({ blink: blinkAt(t) }), 440, 1790, 2.15 * breathe(t))}</g>
      <g transform="translate(${lerp(1300, 760, ph)} ${lerp(1000, 640, ph)}) rotate(${lerp(18, -5, ph)}) scale(1.75)">${A.phone()}</g>${dust(t)}` };
  });
  // 4. Крупный план: «Никто не знал, что я болен»
  sc(a3, a4, t => ({ w: `<g transform="${cam(lerp(2.9, 3.4, E(t, a3, a4)), 540, 1090, 0, noise(t, .5) * 3, 0)}">${A.bgRoom({ t })}${put(A.ilya({ blink: blinkAt(t, 3.1) }), 440 + 100, 1790, 2.15 * breathe(t))}</g>${dust(t)}`, vig: 1 }));
  // 5. Вера идёт из глубины коридора, Илья спиной (из-за спины)
  sc(a4, a5, t => {
    const k = E(t, a4, a5 - .1);
    return { w: `<g transform="${cam(1.05, 540, 1000, 0)}">${A.bgCorridor({ end: 'exit', vx: -40, lamp: lampFlicker(t + 5), notes: false })}
      ${put(A.vera({ beam: false }), lerp(580, 640, k), lerp(1120, 1780, k), lerp(.5, 1.75, k), false)}
      <g opacity="${E(t, a4 + .1, a4 + .5) * .5}"><polygon points="${lerp(590, 760, k)},${lerp(1000, 1450, k)} 1080,${lerp(900, 1100, k)} 1080,${lerp(1220, 1780, k)}" fill="#f3dc96" opacity=".35"/></g>
      ${put(A.ilya({ back: true }), 190, 1920, 2.7 * breathe(t))}</g>${dust(t)}` };
  });
  // 6. 21:14 — крупно часы
  sc(a5, a6, t => ({ w: `<rect width="1080" height="1920" fill="#1b232c"/><rect width="1080" height="1920" fill="url(#lampR)" opacity="${lampFlicker(t) * .7}"/>
    <g transform="translate(540 900) scale(${lerp(3.2, 3.6, E(t, a5, a6))}) translate(-130 -55)">${A.clock((t * 2 | 0) % 2 ? '21 14' : '21:14')}</g>${dust(t)}` }));
  // 7. «Все были дома» — вид из дверного проёма, свет из-под дверей
  sc(a6, a7, t => {
    const k = E(t, a6, a7);
    return { w: `<g transform="${cam(lerp(1.05, 1.28, k), lerp(600, 520, k), 1000, 0)}">${A.bgCorridor({ vx: 190, strips: true, lamp: lampFlicker(t + 2) * .85, crack: 0 })}</g>
      <polygon points="0,0 260,0 200,1920 0,1920" fill="#06080b"/><polygon points="0,0 1080,0 1080,150 0,210" fill="#06080b"/><polygon points="200,210 260,0 270,0 215,1920 200,1920" fill="#14100d"/>${dust(t)}` };
  });
  // 8. Дом затрещал: из-за спины, трещина, тряска
  sc(a7, a8, t => {
    const sh = Math.max(0, 1 - (t - a7) / 1.4);
    return { w: `<g transform="${cam(1.12, 540, 1000, noise(t, 3) * 1.4 * sh, noise(t, 4) * 26 * sh, noise(t + 2, 4) * 20 * sh)}">${A.bgCorridor({ vx: -110, lamp: lampFlicker(t * 3, 1), crack: E(t, a7, a7 + .9), notes: false })}
      ${put(A.ilya({ back: true }), 290, 1980, 2.9)}</g>${dust(t, 40)}${flash(t, a7 + .05, .2, '#fff', .25)}` };
  });
  // 9. Дом кренится: комната, всё едет, Илья пошатывается
  sc(a8, a9, t => {
    const k = E(t, a8, a9 - .2), bx = lerp(150, 980, E(t, a8 + .2, a9 - .1));
    return { w: `<g transform="${cam(1.2, 540, 1000, TILT(t), noise(t, 1) * 5, 0)}">${A.bgRoom({ t: t * 3 })}
      <g transform="translate(${bx} 1196) rotate(${bx * 1.4})"><rect x="-18" y="-24" width="36" height="48" rx="10" fill="#2f5a45"/><rect x="-7" y="-40" width="14" height="18" rx="4" fill="#2f5a45"/></g>
      ${put(A.ilya({ blink: blinkAt(t) }), 480, 1790, 2.15, false, Math.sin(t * 7) * 3 * (1 - k * .4))}</g>${dust(t)}${flash(t, a8, .12, '#fff', .15)}` };
  });
  // 10. Двери с записками — крупные, целиком в кадре
  sc(a9, a10, t => ({ w: `<g transform="${cam(1.17, 540, 880, TILT(t), noise(t, .8) * 3, 0)}">${A.bgDoorClose({ n: 41, mode: T(69) > t ? 'bare' : 'note', t, rot: -3 })}</g>${dust(t, 14)}` }));
  sc(a10, a11, t => ({ w: `<g transform="${cam(lerp(1.17, 1.22, E(t, a10, a11)), 540, 880, TILT(t), 0, 0)}">${A.bgDoorClose({ n: 44, mode: t < a10 + .12 ? 'bare' : 'note', t, rot: 4, s: 3.5 })}</g>${dust(t, 14)}` }));
  sc(a11, a12, t => {
    const k = pop(t, T(72) - .05, .3);
    return { w: `<g transform="${cam(1.17, 540, 880, TILT(t) * .6)}">${A.bgDoorClose({ n: 41, mode: 'bare', t })}</g><rect width="1080" height="1920" fill="#000" opacity=".58"/>
      <g transform="translate(540 880) scale(${k * lerp(1, 1.04, E(t, a11, a12))}) translate(-540 -880)">${noteAt(540, 880, 4.6, -2 + Math.sin(t * 2) * .5)}</g>${dust(t, 10)}` };
  });
  // 11. Подвал: спуск → замок → цифры
  sc(a12, a13, t => ({ w: `<g transform="${cam(1.3, lerp(300, 520, E(t, a12, a13)), lerp(860, 1180, E(t, a12, a13)), TILT(t), noise(t, .6) * 6, Math.sin(t * 5) * 6)}">${A.bgBasement({ t, digits: false })}</g>${dust(t, 20)}` }));
  sc(a13, a14, t => {
    const k1 = E(t, a13, a13 + 1.2), led = (t * 3 | 0) % 2 ? 1 : .25;
    return { w: `<g transform="${cam(lerp(1.1, 2.4, k1), lerp(540, 850, k1), lerp(1100, 1045, k1), TILT(t), noise(t, .5) * 4, 0)}">${A.bgBasement({ t, digits: false })}<circle cx="850" cy="980" r="16" fill="#ff5444" opacity="${led * .5}" filter="url(#blur6)"/></g>${dust(t, 20)}` };
  });
  sc(a14, a15, t => {
    const k2 = E(t, a14, a14 + .8), dg = E(t, T(86) - .1, T(86) + .35);
    return { w: `<g transform="${cam(lerp(2.4, 1.0, k2), lerp(850, 540, k2), lerp(1045, 600, k2), TILT(t), noise(t, .5) * 4, 0)}">${A.bgBasement({ t, digits: false })}
      <g opacity="${dg}"><text x="556" y="470" transform="rotate(-3 540 420)" text-anchor="middle" font-family="DejaVu Serif" font-size="165" letter-spacing="28" fill="none" stroke="#f2cf63" stroke-width="7" filter="url(#blur3)">4 1 9 7</text><text x="556" y="470" transform="rotate(-3 540 420)" text-anchor="middle" font-family="DejaVu Serif" font-size="165" letter-spacing="28" fill="none" stroke="#fff1c0" stroke-width="3">4 1 9 7</text></g></g>${dust(t, 20)}` };
  });
  // 12. Лодка на одного
  sc(a15, a16, t => {
    const hl = E(t, T(91) - .1, T(91) + .6);
    return { w: `<g transform="${cam(lerp(1.0, 1.35, E(t, a15, a16)), 540, lerp(1000, 1220, E(t, a15, a16)), TILT(t) * .6)}"><g transform="translate(0 ${Math.sin(t * 1.6) * 6})">${A.bgBoat()}</g>
      <ellipse cx="540" cy="1260" rx="${lerp(150, 300, hl)}" ry="90" fill="#f3dc96" opacity="${hl * .12}" filter="url(#blur6)"/></g>` };
  });
  // 13. Нас было десять
  sc(a16, a17, t => {
    let ppl = '';
    const pos = [[150, 1500, .9], [300, 1440, .95], [460, 1470, 1], [620, 1430, .92], [780, 1480, 1], [930, 1450, .9], [230, 1250, .75], [400, 1230, .78], [700, 1240, .8], [860, 1260, .76]];
    pos.sort((a, b) => a[1] - b[1]).forEach(([x, y, s], i) => {
      const on = E(t, T(94) - .1 + i * .06, T(94) + .2 + i * .06), eyes = t > T(97) - .1 + i * .05;
      ppl += `<g opacity="${on}">${put(A.neighbor(i).replace(/fill="#a9dbe3"/g, `fill="#a9dbe3" opacity="${eyes ? 1 : 0}"`), x, y + 260, 1.9 * s)}</g>`;
    });
    return { w: `<g transform="${cam(lerp(1.0, 1.08, E(t, a16, a17)), 540, 1000, TILT(t) * .5)}"><rect width="1080" height="1920" fill="#0d1014"/><rect width="1080" height="1920" fill="url(#flashC)"/>${ppl}</g>` };
  });
  // 14. Тишина, слышно сердце: крупный план Ильи на тёмном фоне, пульс в такт
  sc(a17, a18, t => {
    const tb = T(98), bt = ((t - tb) % .9 + .9) % .9, beat = t < tb ? 0 : Math.max(Math.exp(-Math.pow(bt / .07, 2)), .7 * Math.exp(-Math.pow((bt - .3) / .07, 2)));
    const z = 3.5 * (1 + beat * .025) * lerp(1, 1.1, E(t, a17, a18));
    return { w: `<rect width="1080" height="1920" fill="#0a0d11"/><circle cx="540" cy="900" r="620" fill="url(#flashC)" opacity="${.7 + beat * .3}"/>
      <g transform="${cam(z, 540, 1670 - 300 * 2.05 + 20, TILT(t))}">${put(A.ilya({ blink: blinkAt(t, 2.9) }), 540, 1720, 2.05)}</g>
      <rect width="1080" height="1920" fill="#6b0f0f" opacity="${beat * .22}"/>${dust(t, 14)}`, vig: 1 };
  });
  // 15. Почерк: две записки рядом, сканирующая линия
  sc(a18, a19, t => {
    const y = lerp(300, 1370, E(t, T(108), T(110) + .3));
    return { w: `<rect width="1080" height="1920" fill="#10151b"/><rect width="1080" height="1920" fill="url(#lampR)" opacity=".5"/>
      ${noteAt(540, 590, 4.0, -3)}${noteAt(540, 1130, 4.0, 3, ['Аня, к. 42', 'конспект'])}
      <rect x="120" y="${y}" width="840" height="6" fill="#f2cf63" opacity="${E(t, T(108) - .1, T(108) + .1) * .7}"/>${dust(t, 14)}` };
  });
  // 16. Аня из 42-й: дверь 42, объявление «ПРОПАЛА» целиком
  sc(a19, a20, t => {
    const k = pop(t, T(113) - .15, .3);
    return { w: `<g transform="${cam(lerp(1.17, 1.22, E(t, a19, a20)), 540, 880, TILT(t))}">${A.bgDoorClose({ n: 42, mode: 'bare', t })}</g>
      <g transform="translate(540 930) scale(${k}) translate(-540 -930)"><g transform="translate(540 930) rotate(${-2 + Math.sin(t * 2) * .6}) scale(2.55) translate(-110 -150)"><g filter="url(#sh)">${A.poster()}</g></g></g>${dust(t, 12)}` };
  });
  // 17. Записки появлялись весь вечер — стопка крупных записок, всё в кадре
  sc(a20, a21, t => {
    const N = [[123, 316, 470, -5], [124, 764, 700, 4], [125, 316, 960, 4], [126, 764, 1190, -4]];
    return { w: `<g transform="${cam(1.17, 540, 880, TILT(t))}">${A.bgDoorClose({ n: 41, mode: 'bare', t })}</g><rect width="1080" height="1920" fill="#000" opacity=".55"/>
      ${N.map(([i, x, y, r]) => { const k = pop(t, T(i) - .05, .25); return k > 0 ? `<g transform="translate(${x} ${y}) scale(${k}) translate(${-x} ${-y})">${noteAt(x, y, 3.0, r)}</g>` : ''; }).join('')}${dust(t, 10)}` };
  });
  // 18. Город: свет везде, кроме нашего дома
  sc(a21, VE, t => {
    const lx = lerp(-100, 1250, E(t, T(132) - .4, T(132) + 1.6)), k = E(t, T(135) - .2, T(137) + .9);
    return { w: `<g transform="${cam(lerp(1.0, 1.55, k), lerp(540, 640, k), lerp(960, 1250, k))}">${A.bgCity({ t, noRain: true, lightX: lx })}</g>${rainOverlay(t, .3)}${flash(t, T(132) - .35, .5, '#f3dc96', .18)}` };
  });
  // титр
  sc(VE, 999, t => {
    const k = E(t, VE + .1, VE + .6);
    return { w: `<rect width="1080" height="1920" fill="#05070a"/><g opacity="${k}"><text x="540" y="860" text-anchor="middle" font-family="Inter" font-weight="900" font-size="150" letter-spacing="20" fill="#e6e1d3">ПОТОП</text>
      <text x="540" y="960" text-anchor="middle" font-family="Inter" font-weight="700" font-size="50" fill="#ff5444">Серия 2 — скоро</text>
      <text x="540" y="1060" text-anchor="middle" font-family="Inter" font-weight="600" font-size="38" fill="#7d8e9a">подпишись, чтобы не пропустить</text></g>
      <text x="540" y="1760" text-anchor="middle" font-family="Inter" font-weight="800" font-size="40" fill="#9fb2bf" opacity="${k}">Решай сам</text>`, noSub: true, vig: .5 };
  });
}

const DEFS = `<defs>
  <radialGradient id="vig" cx=".5" cy=".46" r=".75"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".9"/></radialGradient>
  <radialGradient id="lampR" cx=".5" cy=".3" r=".6"><stop offset="0" stop-color="#e8c76a" stop-opacity=".35"/><stop offset="1" stop-color="#e8c76a" stop-opacity="0"/></radialGradient>
  <radialGradient id="flashC" cx=".5" cy=".45" r=".6"><stop offset="0" stop-color="#f3dc96" stop-opacity=".25"/><stop offset="1" stop-color="#f3dc96" stop-opacity="0"/></radialGradient>
  <filter id="blur6" x="-1" y="-1" width="3" height="3"><feGaussianBlur stdDeviation="6"/></filter>
  <filter id="blur3" x="-.2" y="-.2" width="1.4" height="1.4"><feGaussianBlur stdDeviation="3"/></filter>
  <filter id="sh" x="-10%" y="-10%" width="125%" height="130%"><feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#000" flood-opacity=".55"/></filter>
  <filter id="gray"><feColorMatrix type="saturate" values="0"/></filter></defs>`;

function frame(t) {
  const s = S.find(s => t >= s.a && t < s.b) || S[S.length - 1];
  const r = s.f(t);
  const cut = Math.min(t - s.a, s.b - t), dip = cut < .1 ? (1 - cut / .1) * .8 : 0;
  return `<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">${DEFS}${r.w}${vignette(r.vig ?? .85)}
    <rect width="1080" height="1920" fill="#000" opacity="${dip.toFixed(3)}"/>${r.noSub ? '' : subtitles(t)}</svg>`;
}
window.setup = raw => { WORDS = prepWords(raw); GROUPS = makeGroups(WORDS); WM = {}; raw.forEach(w => WM[w.i] = w); buildScenes(); return GROUPS.map(g => g.map(w => w.d).join(' ')); };
window.render = t => { document.getElementById('stage').innerHTML = frame(t); };
</script></body></html>
